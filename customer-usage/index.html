<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BI2.0客户使用情况</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2933;
      --muted: #647482;
      --line: #d8e1e8;
      --panel: #ffffff;
      --page: #f4f7fa;
      --blue: #2f6f9f;
      --green: #4b8b5f;
      --gold: #b6781f;
      --coral: #b75d4d;
      --nav: #19384f;
      --soft-blue: #e7f0f7;
      --soft-green: #e8f3eb;
      --soft-gold: #fff3d8;
      --soft-coral: #f8e7e3;
      --shadow: 0 6px 16px rgba(31, 41, 51, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: var(--page);
      color: var(--ink);
      letter-spacing: 0;
    }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr);
    }
    aside {
      background: var(--nav);
      color: #e9f1f7;
      padding: 22px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .date {
      font-size: 12px;
      color: #bfd1df;
      line-height: 1.5;
      margin-bottom: 22px;
    }
    nav {
      display: grid;
      gap: 6px;
    }
    nav a {
      color: #d9e7f0;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    nav a:hover, nav a.active {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    main {
      padding: 22px 24px;
      min-width: 0;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 26px;
      line-height: 1.2;
      font-weight: 760;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }
    .source-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 12px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 5px solid var(--blue);
      border-radius: 8px;
      padding: 13px 14px;
      box-shadow: var(--shadow);
      min-height: 98px;
    }
    .metric.green { border-left-color: var(--green); }
    .metric.gold { border-left-color: var(--gold); }
    .metric.coral { border-left-color: var(--coral); }
    .metric-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }
    .metric-value {
      font-size: 31px;
      line-height: 1;
      font-weight: 760;
      margin-bottom: 7px;
      color: #15344a;
    }
    .metric-helper {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    section {
      margin-bottom: 14px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .panel-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
    }
    .hint {
      color: var(--muted);
      font-size: 12px;
    }
    .function-cards {
      padding: 12px 14px 14px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .function-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfdff;
      min-height: 108px;
    }
    .function-title {
      font-weight: 700;
      font-size: 13px;
      line-height: 1.35;
      margin-bottom: 6px;
      min-height: 34px;
    }
    .function-main {
      font-size: 24px;
      line-height: 1;
      font-weight: 760;
      color: #15344a;
      margin-bottom: 8px;
    }
    .function-meta {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .status-list {
      padding: 12px 14px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .status-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fbfdff;
    }
    .status-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .status-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .filters {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(160px, 0.8fr) minmax(160px, 0.8fr) minmax(220px, 1.1fr);
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfdff;
    }
    select, input {
      width: 100%;
      height: 36px;
      border: 1px solid #cbd7df;
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      padding: 0 10px;
      font-size: 13px;
    }
    .table-wrap {
      overflow: auto;
      max-height: 460px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 1080px;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #e5edf2;
      text-align: left;
      vertical-align: top;
      line-height: 1.35;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #eef5fa;
      color: #233847;
      font-weight: 700;
      white-space: nowrap;
    }
    tbody tr:hover {
      background: #f7fbfd;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid #ccd8e1;
      color: #315166;
      background: #f6fafc;
      white-space: nowrap;
    }
    .tag.contract { background: var(--soft-green); color: #2f6d3f; border-color: #c6dfcd; }
    .tag.switch { background: var(--soft-blue); color: #255f89; border-color: #c5dbea; }
    .tag.online { background: var(--soft-gold); color: #7a5416; border-color: #ebd69a; }
    .empty {
      padding: 32px 16px;
      color: var(--muted);
      text-align: center;
    }
    .count-line {
      padding: 10px 14px 12px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--line);
      background: #fbfdff;
    }
    .pager {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .pager button {
      height: 30px;
      border: 1px solid #cbd7df;
      background: #ffffff;
      color: var(--ink);
      border-radius: 6px;
      padding: 0 10px;
      cursor: pointer;
      font-size: 12px;
    }
    .pager button:disabled {
      color: #9aa8b2;
      background: #eef3f6;
      cursor: not-allowed;
    }
    .rules {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      padding: 12px 14px 14px;
    }
    .rule {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfdff;
      min-height: 96px;
    }
    .rule strong {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .rule span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
    @media (max-width: 1060px) {
      .app { grid-template-columns: 1fr; }
      aside { position: static; height: auto; }
      nav { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .metrics, .function-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .status-list { grid-template-columns: 1fr; }
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .rules { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      main { padding: 16px; }
      .topbar { display: block; }
      .source-pill { margin-top: 12px; white-space: normal; }
      .metrics, .function-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filters, .rules { grid-template-columns: 1fr; }
      nav { grid-template-columns: 1fr 1fr; }
      .count-line { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">BI2.0 客户使用</div>
      <div class="date">统计时间<br />截止到 2026年5月29日</div>
      <nav aria-label="页面导航">

        <a href="#rules">状态口径</a>

    <main>
      <div class="topbar" id="overview">
        <div>
          <h1>BI2.0客户使用情况</h1>
          <p class="subtitle">聚合线上开关、签约合同与已上线使用标记，突出当前客户使用现状，并支持查看功能与客户级细则。</p>
        </div>
        <div class="source-pill">数据源：开关编码导出 + BI 2.0客户统计情况</div>
      </div>
      <section class="metrics" id="metricCards"></section>
      <section class="panel" id="functions">
        <div class="panel-head">
          <h2>功能使用统计</h2>
          <span class="hint">指标卡展示客户数、开关与上线情况</span>
        </div>
        <div class="function-cards" id="functionCards"></div>
      </section>
      <section class="panel" id="details">
        <div class="panel-head">
          <h2>客户明细</h2>
          <span class="hint" id="visibleCount"></span>
        </div>
        <div class="filters">
          <select id="functionFilter" aria-label="功能筛选"></select>
          <select id="statusFilter" aria-label="状态筛选">
            <option value="">全部状态</option>
            <option value="switch">线上开关开启</option>
            <option value="contract">已签约合同</option>
            <option value="online">已上线使用</option>
          </select>
          <select id="sourceFilter" aria-label="来源筛选">
            <option value="">全部来源</option>
          </select>
          <input id="keywordInput" type="search" placeholder="搜索客户名称、编码、销售" />
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>客户名称</th>
                <th>功能</th>
                <th>客户编码</th>
                <th>版本/类型</th>
                <th>负责销售</th>
                <th>合同状态</th>
                <th>开关状态</th>
                <th>使用状态</th>
                <th>来源</th>
              </tr>
            </thead>
            <tbody id="detailBody"></tbody>
          </table>
        </div>
        <div class="count-line">
          <span id="pageSummary">每页 50 条</span>
          <div class="pager">
            <button id="prevPage" type="button">上一页</button>
            <span id="pageInfo"></span>
            <button id="nextPage" type="button">下一页</button>
          </div>
        </div>
      </section>
      <section class="panel" id="rules">
        <div class="panel-head">
          <h2>状态口径</h2>
          <span class="hint">用于解释 demo 中的状态标记</span>
        </div>
        <div class="rules" id="ruleCards"></div>
      </section>
    </main>
  </div>

  <script>
    const data = JSON.parse(document.getElementById("demo-data").textContent);
    const pageSize = 50;
    const rows = data.rows;
    let currentPage = 1;
    const formatNumber = (value) => new Intl.NumberFormat("zh-CN").format(value || 0);
    const text = (value) => value || "";
    const includes = (value, keyword) => text(value).toLowerCase().includes(keyword);

    function tag(value, type) {
      return value ? '<span class="tag ' + type + '">' + value + '</span>' : "";
    }

    function renderMetrics() {
      document.getElementById("metricCards").innerHTML = data.statusCards.map((card) => (
        '<article class="metric ' + card.tone + '">' +
          '<div class="metric-label">' + card.label + '</div>' +
          '<div class="metric-value">' + formatNumber(card.value) + '</div>' +
          '<div class="metric-helper">' + card.helper + '</div>' +
        '</article>'
      )).join("");
    }

    function renderFunctionCards() {
      document.getElementById("functionCards").innerHTML = data.functionStats.map((item) => (
        '<article class="function-card">' +
          '<div class="function-title">' + item.function_name + '</div>' +
          '<div class="function-main">' + formatNumber(item.customer_key_count) + '</div>' +
          '<div class="function-meta">' +
            '<span>记录数：' + formatNumber(item.record_count) + '</span>' +
            '<span>线上开关记录：' + formatNumber(item.switchRecords) + '</span>' +
            '<span>签约合同记录：' + formatNumber(item.contractRecords) + '</span>' +
            '<span>上线使用记录：' + formatNumber(item.onlineRecords) + '</span>' +
          '</div>' +
        '</article>'
      )).join("");
    }

    function setupFilters() {
      const functionFilter = document.getElementById("functionFilter");
      functionFilter.innerHTML = '<option value="">全部功能</option>' + data.functions.map((item) => (
        '<option value="' + item.code + '">' + item.name + '</option>'
      )).join("");
      const sourceFilter = document.getElementById("sourceFilter");
      const sources = [...new Set(rows.map((row) => row.source).filter(Boolean))];
      sourceFilter.innerHTML += sources.map((source) => '<option value="' + source + '">' + source + '</option>').join("");
      ["functionFilter", "statusFilter", "sourceFilter", "keywordInput"].forEach((id) => {
        document.getElementById(id).addEventListener("input", () => {
          currentPage = 1;
          renderDetails();
        });
      });
      document.getElementById("prevPage").addEventListener("click", () => {
        currentPage = Math.max(1, currentPage - 1);
        renderDetails();
      });
      document.getElementById("nextPage").addEventListener("click", () => {
        currentPage += 1;
        renderDetails();
      });
    }

    function filteredRows() {
      const functionCode = document.getElementById("functionFilter").value;
      const status = document.getElementById("statusFilter").value;
      const source = document.getElementById("sourceFilter").value;
      const keyword = document.getElementById("keywordInput").value.trim().toLowerCase();
      return rows.filter((row) => {
        if (functionCode && row.function_code !== functionCode) return false;
        if (source && row.source !== source) return false;
        if (status === "switch" && row.switch_status !== "线上开关开启") return false;
        if (status === "contract" && row.contract_status !== "已签约合同") return false;
        if (status === "online" && row.usage_status !== "已上线使用") return false;
        if (keyword) {
          const haystack = [row.customer_name, row.customer_code, row.sales_owner, row.function_name, row.matched_online_customer].join(" ").toLowerCase();
          if (!includes(haystack, keyword)) return false;
        }
        return true;
      });
    }

    function renderDetails() {
      const result = filteredRows();
      const body = document.getElementById("detailBody");
      const totalPages = Math.max(1, Math.ceil(result.length / pageSize));
      currentPage = Math.min(Math.max(1, currentPage), totalPages);
      const start = (currentPage - 1) * pageSize;
      const pageRows = result.slice(start, start + pageSize);
      document.getElementById("visibleCount").textContent = "当前筛选：" + formatNumber(result.length) + " 条";
      document.getElementById("pageSummary").textContent = result.length
        ? "显示第 " + formatNumber(start + 1) + "-" + formatNumber(start + pageRows.length) + " 条，共 " + formatNumber(result.length) + " 条"
        : "每页 50 条";
      document.getElementById("pageInfo").textContent = "第 " + currentPage + " / " + totalPages + " 页";
      document.getElementById("prevPage").disabled = currentPage <= 1;
      document.getElementById("nextPage").disabled = currentPage >= totalPages;
      if (!result.length) {
        body.innerHTML = '<tr><td colspan="9"><div class="empty">没有符合条件的客户记录</div></td></tr>';
        return;
      }
      body.innerHTML = pageRows.map((row) => (
        '<tr>' +
          '<td><strong>' + text(row.customer_name) + '</strong></td>' +
          '<td>' + text(row.function_name) + '</td>' +
          '<td>' + text(row.customer_code) + '</td>' +
          '<td>' + text(row.edition_or_type) + '</td>' +
          '<td>' + text(row.sales_owner) + '</td>' +
          '<td>' + tag(row.contract_status, "contract") + '</td>' +
          '<td>' + tag(row.switch_status, "switch") + '</td>' +
          '<td>' + tag(row.usage_status === "已上线使用" ? "已上线使用" : "", "online") + '</td>' +
          '<td>' + text(row.source) + '</td>' +
        '</tr>'
      )).join("");
    }

    function renderRules() {
      const onlineRuleText = data.onlineRules.map((item) => {
        const names = item.matched_customer_names.length ? item.matched_customer_names.join("、") : "未命中";
        return item.customer_keyword + "：" + names;
      }).join("；");
      const rules = [
        ["去重逻辑", "去重逻辑：客户编码优先，其次客户名称。"],
        ["线上开关开启", "来源为开关编码导出 Excel，每条记录对应一个功能开关。"],
        ["已签约合同", "来源为 BI 2.0客户统计情况.xlsx，用于识别已签约客户。"],
        ["已上线使用", "按用户指定客户关键词标记：欧菲斯、凯赛、中拓、华南期货。"],
        ["上线命中结果", onlineRuleText],
      ];
      document.getElementById("ruleCards").innerHTML = rules.map((item) => (
        '<div class="rule"><strong>' + item[0] + '</strong><span>' + item[1] + '</span></div>'
      )).join("");
    }

    renderMetrics();
    renderFunctionCards();
    setupFilters();
    renderDetails();
    renderRules();
  </script>
